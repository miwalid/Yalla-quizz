<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Yalla Quiz</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Concept : une fête colorée. Fond violet profond, boutons jaune/rose/bleu/vert très arrondis,
   un grand écran principal pour l'animateur et des téléphones simples pour les joueurs. */
:root{
  --bg:#26106e; --bg2:#3a1b99; --ink:#ffffff; --ink-soft:#d9ceff; --ink-dark:#2a1259;
  --panel:rgba(255,255,255,.12); --panel2:rgba(255,255,255,.2); --line:rgba(255,255,255,.22);
  --yellow:#ffd43b; --orange:#ff8a2b; --pink:#ff4d94; --green:#27d3a2; --blue:#38b6ff;
  --violet:#a98aff; --teal:#22d3d3; --pink2:#ff7ae0; --red:#ff6266; --blue2:#6e97ff;
  --shadow:rgba(10,0,40,.38);
  --f-d:'Fredoka','Cairo',system-ui,sans-serif; --f-b:'Cairo','Fredoka',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 8% -8%,#5f2fd8 0,transparent 62%),radial-gradient(800px 520px at 100% 108%,rgba(255,77,148,.32) 0,transparent 62%);
  background-attachment:fixed;color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.4;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
body.with-phone #app{padding-inline-end:322px}
#app{min-height:100%;padding-inline:16px;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--f-d);margin:0;font-weight:700;text-wrap:balance}
.wrap{width:100%;max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;padding-block:8px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-weight:700;font-size:1.2rem}
.brand svg{width:38px;height:38px}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;min-height:38px}
.icon-btn:hover{background:var(--panel2)}
.btn{--c:var(--yellow);border:0;background:var(--c);color:var(--ink-dark);font-family:var(--f-d);font-weight:700;font-size:1.15rem;border-radius:18px;padding:12px 22px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s,filter .12s;min-height:48px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.pink{--c:var(--pink)} .btn.green{--c:var(--green)} .btn.blue{--c:var(--blue)}
.btn.big{font-size:1.5rem;padding:16px 28px;border-radius:22px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:1.2rem}
.note{color:var(--ink-soft);margin:0;font-size:.95rem}
.pill{background:var(--panel2);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.95rem}
.pill.cat{background:var(--c);color:var(--ink-dark)}

/* accueil */
.home{width:100%;max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;padding-bottom:28px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
.mascot{width:132px;height:132px;animation:bob 2.4s ease-in-out infinite}
.logo{font-size:3.2rem;line-height:1;letter-spacing:.01em;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.logo b{color:var(--yellow)}
.tag{margin:6px 0 0;color:var(--ink-soft);font-size:1.1rem}
.home-actions{display:flex;flex-direction:column;gap:14px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

/* préparation */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{--c:var(--yellow);border:3px solid var(--c);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.chip.on{background:var(--c);color:var(--ink-dark)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 18px;font-weight:700;cursor:pointer;min-width:64px}
.seg button.on{background:var(--yellow);color:var(--ink-dark);border-color:var(--yellow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.95rem;color:var(--ink-soft)}
.field input,.field select{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px;width:100%}
.field select option{color:#222}
details.card summary{cursor:pointer;font-family:var(--f-d);font-weight:700;font-size:1.15rem}
.vlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.vlist li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:12px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.actions .btn.big{flex:1 1 260px;width:auto}

/* salon */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
.join-qr{display:block;width:min(100%,232px);margin:4px auto;background:#fff}
.join-qr svg{display:block;width:100%;height:auto;aspect-ratio:1}
.join-link{overflow-wrap:anywhere;color:#fff}
.codebox{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.code{font-family:var(--f-d);font-weight:700;font-size:clamp(2.6rem,6.4vw,4.6rem);letter-spacing:.1em;max-width:100%;color:var(--ink-dark);background:var(--yellow);border-radius:28px;padding:6px 28px;box-shadow:0 8px 0 rgba(0,0,0,.28);direction:ltr}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;min-height:120px}
.pchip{--c:var(--pink);display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;max-width:100%}
.pchip i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--c);color:var(--ink-dark);display:grid;place-items:center;font-family:var(--f-d);flex:none}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip.off{opacity:.45}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}

/* écran principal : question */
.hostq{--c:var(--yellow);width:100%;max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;padding-block:6px 24px;flex:1}
.hq-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer-num{margin-inline-start:auto;font-family:var(--f-d);font-weight:700;font-size:2.6rem;line-height:1;background:var(--yellow);color:var(--ink-dark);border-radius:50%;width:68px;height:68px;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.28);font-variant-numeric:tabular-nums}
.timer{height:16px;border-radius:99px;background:rgba(0,0,0,.28);overflow:hidden;direction:ltr}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--orange));border-radius:99px;transition:width .2s linear}
html[dir=rtl] .timer{direction:rtl}
.prompt{font-size:clamp(1.6rem,4.2vw,3rem);line-height:1.18;text-align:center;padding-block:10px;min-height:2.4em;display:grid;place-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{--c:var(--pink);display:flex;align-items:center;gap:12px;text-align:start;border:0;background:var(--c);color:var(--ink-dark);border-radius:22px;padding:16px 18px;font-family:var(--f-d);font-weight:600;font-size:clamp(1.1rem,2.6vw,1.8rem);box-shadow:0 7px 0 rgba(0,0,0,.28);min-height:72px;cursor:default;position:relative;overflow:hidden}
.opt b{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.55);display:grid;place-items:center;flex:none;font-size:1.4rem}
.opt .bar{position:absolute;inset:auto 0 0 0;height:8px;background:rgba(0,0,0,.35);transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
html[dir=rtl] .opt .bar{transform-origin:right}
.opt .cnt{margin-inline-start:auto;font-weight:700;background:rgba(0,0,0,.25);color:#fff;border-radius:99px;padding:2px 12px;font-size:1rem}
.opt.dim{opacity:.35;filter:saturate(.4)}
.opt.win{outline:6px solid #fff;animation:win .7s ease both}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.opt button{display:none}
.hq-foot{display:flex;align-items:center;gap:14px;margin-top:auto;flex-wrap:wrap}
.meter{flex:1 1 160px;height:14px;background:rgba(0,0,0,.28);border-radius:99px;overflow:hidden;direction:ltr}
.meter i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .35s}
#mtxt{font-weight:700;color:var(--ink-soft)}
.big-answer{font-family:var(--f-d);font-weight:700;font-size:clamp(2rem,6vw,4.2rem);text-align:center;color:var(--ink-dark);background:var(--green);border-radius:28px;padding:20px 28px;box-shadow:0 8px 0 rgba(0,0,0,.28);animation:win .8s ease both}
.hint{text-align:center;color:var(--ink-soft);font-size:1.15rem}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:460px;margin-inline:auto;width:100%}
.pad{--c:var(--pink);aspect-ratio:1.4;border-radius:26px;background:var(--c);opacity:.38;border:0;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:opacity .08s,transform .08s}
.pad.flash{opacity:1;transform:scale(1.06);box-shadow:0 0 40px var(--c)}
.lyrics{display:flex;flex-direction:column;gap:6px;align-items:center;font-family:var(--f-d);font-weight:600;font-size:clamp(1.4rem,3.4vw,2.4rem);direction:ltr}
.ly{margin:0;opacity:.45;transition:opacity .3s}
.ly.act{opacity:1}
.ly span{display:inline-block;transition:color .15s,transform .15s}
.ly span.w{margin-inline-end:.35em}
.ly span.on{color:var(--yellow);transform:scale(1.12)}
.spot{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.spot .av{width:110px;height:110px;border-radius:50%;background:var(--c);color:var(--ink-dark);display:grid;place-items:center;font-family:var(--f-d);font-size:3.4rem;font-weight:700;box-shadow:0 0 0 8px rgba(255,255,255,.2),0 0 60px var(--c);animation:bob 2s ease-in-out infinite}
.spot .nm{font-family:var(--f-d);font-size:2.4rem;font-weight:700}

/* annonce de catégorie */
.splash{--c:var(--yellow);flex:1;display:grid;place-items:center;text-align:center;align-content:center;gap:10px;min-height:70vh}
.splash .sp-n{font-weight:700;color:var(--ink-soft);font-size:1.3rem;animation:zoom .5s both}
.splash h2{font-size:clamp(2.2rem,8vw,5.5rem);background:var(--c);color:var(--ink-dark);padding:.15em .6em;border-radius:36px;box-shadow:0 10px 0 rgba(0,0,0,.28);animation:zoom .6s .1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes zoom{0%{transform:scale(.3) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* classement */
.lb{--row:62px;list-style:none;margin:0;padding:0;position:relative;width:100%;max-width:760px;margin-inline:auto}
.lb li{--c:var(--pink);position:absolute;inset-inline:0;top:0;height:54px;display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding-inline:8px 16px;transition:transform .9s cubic-bezier(.3,1,.3,1),opacity .5s}
.lb li .rk{width:38px;height:38px;border-radius:50%;background:var(--c);color:var(--ink-dark);display:grid;place-items:center;font-family:var(--f-d);font-weight:700;flex:none}
.lb li .nm{font-weight:700;font-size:1.2rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li .dl{color:var(--green);font-weight:700}
.lb li .sc{font-family:var(--f-d);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:end}
.lb li.me{border-color:var(--yellow);background:rgba(255,212,59,.2)}
.fast{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;color:var(--ink-soft)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;max-width:760px;margin:18px auto 0;width:100%;min-height:340px}
.pod{--c:var(--yellow);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .nm{font-family:var(--f-d);font-weight:700;font-size:1.3rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-weight:700;color:var(--ink-soft)}
.pod .blk{width:100%;background:var(--c);color:var(--ink-dark);border-radius:22px 22px 0 0;display:grid;place-items:start center;padding-top:10px;font-family:var(--f-d);font-weight:700;font-size:3rem;height:0;transition:height 1.2s cubic-bezier(.2,.9,.2,1)}
.pod.p1{--c:var(--yellow)} .pod.p2{--c:var(--blue)} .pod.p3{--c:var(--orange)}
.pod .crown{width:54px;height:54px}
.restlist{max-width:760px;margin:16px auto 0;width:100%;display:flex;flex-direction:column;gap:6px}
.restlist div{display:flex;gap:12px;background:var(--panel);border-radius:14px;padding:8px 14px}
.restlist b{min-width:2.2ch}.restlist span{flex:1}

/* téléphone des joueurs */
.pv{--c:var(--yellow);min-height:100%;display:flex;flex-direction:column;gap:14px;padding:14px 0 24px;width:100%;max-width:520px;margin-inline:auto}
.pv h2{font-size:1.8rem;text-align:center}
.pv .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;flex:1;padding-block:10px}
.pv .opts{grid-template-columns:1fr;gap:12px}
.pv .opt{cursor:pointer;min-height:66px;font-size:1.25rem;width:100%;transition:transform .1s}
.pv .opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.pv .timer{height:12px}
.pv .bigico{width:120px;height:120px}
.pv .pts{font-family:var(--f-d);font-weight:700;font-size:3.4rem;color:var(--yellow)}
.pv .ok{--c:var(--green)} .pv .ko{--c:var(--red)}
.pv .res-badge{font-family:var(--f-d);font-weight:700;font-size:2.4rem;background:var(--c);color:var(--ink-dark);border-radius:28px;padding:10px 28px;box-shadow:0 7px 0 rgba(0,0,0,.28);animation:zoom .5s both}
.pv .shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pv .answer-in{display:flex;flex-direction:column;gap:12px}
.pv .answer-in input{background:rgba(0,0,0,.28);border:3px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1.4rem;min-height:60px;width:100%;text-align:center}
.pv .pads{max-width:none}
.pv .pad{opacity:1;cursor:pointer;aspect-ratio:1.6}
.pv .pad:active{transform:scale(.95)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.f{background:var(--yellow)}
.tok{display:flex;flex-direction:column;gap:6px}
.tok small{color:var(--ink-soft);font-weight:700;text-align:center}
.tokgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;direction:ltr}
.tokgrid button{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-family:var(--f-d);font-weight:700;font-size:.95rem;padding:0;cursor:pointer;color:var(--ink)}
.tokgrid button.sel{background:var(--yellow);color:var(--ink-dark);border-color:var(--yellow);transform:scale(1.12)}
.tokgrid button:disabled{opacity:.22;text-decoration:line-through;cursor:not-allowed}
.tok.shake{animation:shake .5s}
.pv .opt.chosen{outline:5px solid #fff;outline-offset:2px;animation:win .6s both;cursor:default}
.pv .opt.dim{cursor:default}
.sentbar{background:var(--green);color:var(--ink-dark);border-radius:18px;padding:8px 14px;display:flex;flex-direction:column;text-align:center;gap:2px;animation:zoom .4s both}
.sentbar b{font-family:var(--f-d);font-size:1.2rem}
.sentbar span{font-size:.9rem;font-weight:600}
.mine-bubble{background:var(--yellow);color:var(--ink-dark);border-radius:20px;padding:14px 18px;text-align:center;font-family:var(--f-d);font-weight:700;font-size:1.6rem;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.mine-bubble small{font-size:.8rem;font-weight:700;opacity:.7}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;max-width:720px;margin-inline:auto;width:100%;direction:ltr}
.jgrid button{height:58px;border-radius:18px;font-family:var(--f-d);font-weight:700;font-size:1.4rem;background:var(--panel);border:2px solid var(--line);color:var(--ink);cursor:pointer;padding:0}
.jgrid button:hover{background:var(--panel2)}
.jgrid button.sel{background:var(--yellow);color:var(--ink-dark);border-color:var(--yellow);transform:scale(1.08)}
.judge .spot{margin-top:4px}
.vrow{opacity:0;animation:vin .6s both;align-items:center}
.vrow .vn{flex:1;min-width:0}
.vrow .vp{color:var(--yellow);font-family:var(--f-d);font-size:1.5rem}
@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.stars{display:flex;gap:6px;justify-content:center;direction:ltr}
.stars button{border:0;background:transparent;cursor:pointer;padding:2px}
.stars svg{width:54px;height:54px;fill:rgba(255,255,255,.25);transition:fill .15s,transform .15s}
.stars button:hover svg,.stars button.on svg{fill:var(--yellow);transform:scale(1.1)}
.lyr-box{background:rgba(0,0,0,.25);border-radius:20px;padding:14px;text-align:center;font-family:var(--f-d);font-size:1.2rem;display:flex;flex-direction:column;gap:4px;direction:ltr}
.joinform{display:flex;flex-direction:column;gap:14px}
.joinform input{text-align:center;font-family:var(--f-d);font-size:1.6rem;font-weight:600}
#codein{letter-spacing:.3em;text-transform:uppercase;direction:ltr}
.err{color:var(--yellow);font-weight:700;text-align:center;margin:0}

/* démo : téléphone flottant */
.phone{position:fixed;inset-block-end:14px;inset-inline-end:14px;width:290px;height:min(560px,calc(100% - 28px));border-radius:34px;border:9px solid #12062f;background-color:var(--bg);background-image:linear-gradient(160deg,#4a22b8,#26106e);overflow-y:auto;overflow-x:hidden;padding-inline:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);z-index:20}
.phone .pv{padding-top:6px}
.phone .opt{font-size:1.05rem;min-height:56px;padding:10px 14px}
.phone .logo{font-size:2rem}
.phone-x{display:none;position:absolute;inset-block-start:6px;inset-inline-end:6px;z-index:2;padding:2px 12px;min-height:34px}
@media (max-width:899px){
  .phone{inset:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
  .phone-x{display:block}
  .phone #pscreen{padding-top:28px}
}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;inset-block-start:16px;inset-inline:16px;margin-inline:auto;width:fit-content;max-width:90%;background:var(--yellow);color:var(--ink-dark);padding:10px 18px;border-radius:16px;font-weight:700;z-index:60;box-shadow:0 6px 0 rgba(0,0,0,.25)}

@media (max-width:760px){
  .lobby{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .logo{font-size:2.6rem}
  .phone{width:min(290px,calc(100% - 28px))}
}

const LRI='⁦',PDI='⁩';

function memQ(len){
  return {cat:'memoire',type:'mem',p:memoryPrompt(),seq:Array.from({length:len},()=>rnd(4))};

function calcQ(){
  const k=rnd(4);let a,b,c,e,ans;
  if(k===0){a=rint(23,68);b=rint(14,39);e=`${a} + ${b}`;ans=a+b;}
  else if(k===1){a=rint(60,99);b=rint(12,a-15);e=`${a} − ${b}`;ans=a-b;}
  else if(k===2){a=rint(4,9);b=rint(6,12);e=`${a} × ${b}`;ans=a*b;}
  else{a=rint(3,9);b=rint(3,9);c=rint(5,30);e=`${a} × ${b} + ${c}`;ans=a*b+c;}
  const ex=LRI+e+' = ?'+PDI;
  return {cat:'memoire',type:'text',exact:true,p:{fr:'Calcul mental : '+ex,ar:'حساب ذهني: '+ex},accept:[String(ans)],show:{fr:String(ans),ar:String(ans)}};
}

    case 'memoire':{const a=[memQ(4),memQ(5),memQ(6),calcQ(),calcQ(),calcQ(),calcQ()];return shuffle(a);}
    case 'karaoke':return shuffle(TUNES.filter(x=>x.lines)).map(karaokeQ);
    case 'video':return (cfg.videos||[]).map(videoQ);

function buildPools(cfg){

function applyTime(q,cfg){
  if(q.custom){q.time=q.customTime;return;}

/* ========================= Réponses écrites ========================= */
function norm(s){
  s=String(s||'').toLowerCase().trim();
  s=s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  s=s.replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
  s=s.normalize('NFD').replace(/[̀-ًͯ-ٰٟـ]/g,'');
  s=s.replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^(le |la |les |l |un |une |des |ال)/,'');
  return s;
}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[n];
}

const BANK_KEY='yq_category_content_v1';
let categoryContent={};
try{
  const saved=JSON.parse(store.get(BANK_KEY)||'{}');
  for(const cat of BASE_CATEGORIES){
    if(Array.isArray(saved?.[cat])&&saved[cat].length<=100)categoryContent[cat]=saved[cat];

function categoryDefaults(cat){
  if(cat==='video')return CFG.videos.map(videoQ);
  if(cat==='karaoke')return TUNES.filter(tune=>tune.lines).map(karaokeQ);
  if(cat==='melodie')return TUNES.map(tune=>{
    const choices=[tune,...TUNES.filter(other=>other!==tune).slice(0,3)];
    return {...melQ(tune),opts:choices.map(choice=>choice.title),ok:0,generated:true};
  });
  if(cat==='memoire')return [
    ...[4,5,6].map(length=>({cat,type:'mem',p:memoryPrompt(),length,generated:true})),
    ...Array.from({length:4},()=>({cat,type:'text',p:calcQ().p,exact:true,generated:true}))
  ];
  return BANK[cat]||[];
}
function categoryEntries(cat){return categoryContent[cat]??categoryDefaults(cat);}
function categoryCount(cat){
  if(categoryContent[cat])return categoryContent[cat].length;
  if(cat==='video')return CFG.videos.length;
  if(cat==='memoire')return 7;
  if(cat==='melodie')return TUNES.length;
  if(cat==='karaoke')return TUNES.filter(tune=>tune.lines).length;
  return BANK[cat]?.length||0;
}
function availableCategories(){return CFG.cats.filter(cat=>!BASE_CATEGORIES.includes(cat)||categoryCount(cat)>0);}
function editedQuestion(question){
  if(question.generated&&question.type==='mem')return {...memQ(question.length),p:question.p};
  if(question.generated&&question.type==='text')return calcQ();
  if(question.generated&&question.type==='melody')return {...melQ(TUNES.find(tune=>tune.id===question.tune)),p:question.p};
  return prepQ(question);
}
function commitCategory(cat,items){
  const next={...categoryContent,[cat]:items};
  if(!store.set(BANK_KEY,JSON.stringify(next)))return false;
  categoryContent=next;
  if(!items.length)CFG.cats=CFG.cats.filter(id=>id!==cat);
  else if(cat==='video'&&!CFG.cats.includes(cat))CFG.cats.push(cat);
  return true;
}

      }else if(old?.media&&!removeFile)question.media=old.media;
      else if(type==='video')return fail(mediaError);

      if((type==='melody'||type==='karaoke')&&!question.media){
        const tune=TUNES.find(song=>song.id===read(fields,'tune')&&(type!=='karaoke'||song.lines));
        if(!tune)return fail(mediaError);
        question.tune=tune.id;
      }
      if(performanceMedia(question)){
        question.performanceTime=Number(read(fields,'performance-time'));
        if(!Number.isInteger(question.performanceTime)||question.performanceTime<5||question.performanceTime>900)return fail(mediaError);
        if(type==='karaoke')question.lyrics=pair(fields,'lyrics');
      }
    }
    if(newMedia){
      saving=true;dialog.inert=true;setStatus(t('mediaSaving'));
      try{await mediaWrite([[question.media.id,new Blob([newMedia],{type:question.media.mime})]]);}
      catch(e){fail('mediaSaveBad');return;}
      finally{saving=false;dialog.inert=false;}
    }
    const target=index<0?items.length:index;
    items[target]=question;
    if(!commitCategory(cat,items))return fail('saveFail');
    index=target;removeFile=false;render();setStatus(t('bankSaved'));
    $('[type=submit]',form).focus();
  });
  dialog.addEventListener('cancel',event=>{if(saving)event.preventDefault();});
  dialog.addEventListener('close',()=>{
    stopPhonePreview();
    dialog.remove();
    renderSetup();
    $('[data-act="bankedit"]')?.focus();
  },{once:true});
  document.body.appendChild(dialog);
  render();
  dialog.showModal();
}

function sessionId(){return globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
function encodeGame(game){
  return JSON.stringify({version:2,savedAt:Date.now(),remaining:Math.max(0,game.tEnd-Date.now()),game},(k,v)=>v instanceof Map?{_yq:'Map',v:[...v]}:v instanceof Set?{_yq:'Set',v:[...v]}:v);
}
function readSavedGame(){
  try{
    const raw=store.get(SAVE_KEY);if(!raw)return null;
    const data=JSON.parse(raw,(k,v)=>v&&v._yq==='Map'?new Map(v.v):v&&v._yq==='Set'?new Set(v.v):v);
    const g=data.game;
    if(data.version!==2||!g||!/^[A-Z]{4}$/.test(g.code)||!(g.players instanceof Map)||!(g.used instanceof Set)||!(g.ans instanceof Map)||!g.cfg||!Array.isArray(g.state)||g.players.size>MAX_PLAYERS||g.phase==='end')return null;
    return data;
  }catch(e){return null;}
}
function saveGame(){
  if(!G)return;
  try{
    // Une pause conserve le temps restant mémorisé, même après plusieurs rechargements.
    const data=encodeGame(G);
    if(!store.set(SAVE_KEY,data)&&!saveWarning){saveWarning=true;toast(t('saveFail'));}
  }catch(e){if(!saveWarning){saveWarning=true;toast(t('saveFail'));}}
}
function resumeGame(){
  const data=readSavedGame();if(!data){toast(t('savedBad'));return;}
  if(data.game.mode==='live'&&!NET.room){toast(t('offline'));return;}
  NET.codeRetries=0;
  G=data.game;(G.cfg.miniGames||[]).filter(validMini).forEach(registerMini);S.mode=G.mode;S.screen='host';G.quitArm=false;G.finishing=false;
  if(G.phase!=='paused'){
    G.resumePhase=G.phase;G.resumeState=G.state;G.resumeRemaining=data.remaining;G.resumeDuration=G.tEnd-G.tStart;
  }
  G.players.forEach(p=>{if(!p.bot)p.online=false;});
  G.phase='paused';
  if(S.mode==='live'&&NET.room){
    NET.unsubPeers=NET.room.onPeers(ch=>onPeers(ch));if(NET.p2p)hostP2P();
  }
  if(S.mode==='demo'){
    PV.root=$('#pscreen');PV.code=G.code;PV.sid=G.sid;PV.pid='moi';PV.name=t('you');PV.lastKey='';PV.used=new Set();PV.score=0;PV.pending=null;
    const me=G.players.get('moi');if(me)me.online=true;
  }
  clearInterval(tickId);tickId=setInterval(hostTick,200);clearInterval(hbId);hbId=setInterval(heartbeat,3000);
  setState([{k:'paused'}]);renderHost();heartbeat();
}
function continueGame(){
  if(!G||G.phase!=='paused')return;
  const phase=G.resumePhase,state=G.resumeState,remaining=G.resumeRemaining,duration=G.resumeDuration;
  G.resumePhase=null;G.resumeState=null;G.phase=phase;G.finishing=false;
  if(phase==='intro'||phase==='watch'){
    // Les séquences de mémoire et les vidéos repartent avant l'ouverture des réponses.
    if(needsWatch(G.q))goWatch();else beginAsk();return;
  }
  if(phase==='ask'||phase==='pick'){
    G.tEnd=Date.now()+remaining;G.tStart=G.tEnd-duration;
    if(phase==='ask'){
      setState([questionMsg()]);renderHost();
      if(G.q.type==='melody')playRoundMelody();
      if(G.q.type==='karaoke')startKaraoke();
      scheduleBots();
    }else{setState([pickMsg()]);renderHost();}
  }else{setState(state);renderHost();}
  heartbeat();
}

function emitG(m){

function cleanName(n,pid){
  n=String(n||'').replace(/[\u0000-\u001f​-‏‪-‮⁦-⁩<>]/g,'').trim().slice(0,14);
  if(!n)n='Joueur';
  let base=n,k=2;const used=new Set([...G.players.values()].filter(p=>p.pid!==pid).map(p=>p.name));
  while(used.has(n))n=base+' '+(k++);

function onPeers(ch){
  if(!G||G.mode!=='live')return;
  const presences=ch.peers.filter(pe=>pe.kind==='viewer'&&pe.presence&&pe.presence.r==='p'&&pe.presence.c===G.code&&typeof pe.presence.id==='string'&&/^[a-z0-9]{4,8}$/.test(pe.presence.id));
  const seen=new Set(presences.map(pe=>pe.presence.id)),returning=new Set([...G.players.values()].filter(p=>!p.online&&seen.has(p.pid)).map(p=>p.pid));
  G.players.forEach(p=>{if(!p.bot)p.online=seen.has(p.pid);});
  presences.forEach(pe=>{const pr=pe.presence,p=playerInput(pr.id,pr.n,pr);if(p&&returning.has(p.pid))syncPlayer(p);});
  updateLobby();updateCounts();if(G.phase==='paused')renderHost();saveGame();
}
function playerInput(pid,name,pres,meta){
  if(!G)return null;
  let p=G.players.get(pid);const reconnect=!p||!p.online;
  if(!p){
    if(G.players.size>=MAX_PLAYERS){sendToPlayer(pid,{k:'denied',reason:'full'});return null;}
    p={pid,name:cleanName(name,pid),used:new Set(),score:0,delta:0,online:true,color:pcolor(G.players.size),bot:!!(meta&&meta.bot),skill:(meta&&meta.skill)||.5};
    G.players.set(pid,p);sfx.join();
  }
  p.online=true;
  if(G.phase==='lobby')updateLobby();else updateCounts();
  if(pres&&pres.q!=null&&pres.a!=null){
    if(G.phase==='pick'&&pres.q===G.qk&&G.chooser&&p.pid===G.chooser.pid&&G.avail.includes(pres.a)&&Date.now()<G.tEnd)chooseCat(pres.a);
    else if(pres.sid===G.sid)acceptAnswer(p,pres.a,pres.tk,pres.q);
  }
  if(reconnect||pres&&pres.sync)syncPlayer(p);
  saveGame();return p;
}
function onlineList(){return [...G.players.values()].filter(p=>p.online);}
function expectedAnswerers(){return onlineList();}
function botTok(p){const f=[];for(let n=1;n<=SCORING.tokens;n++)if(!p.used.has(n))f.push(n);return f.length?f[rnd(f.length)]:0;}
function sendToPlayer(pid,m){
  if(!G)return;m={...m,c:G.code,sid:G.sid,to:pid,catalog:catalogue()};
  if(G.mode==='demo'){if(pid===PV.pid)setTimeout(()=>pvReceive(m),0);return;}
  if(NET.room){try{const r=NET.room.emitTo?NET.room.emitTo(pid,'g',m):NET.room.emit('g',m);if(r&&r.catch)r.catch(()=>{});}catch(e){}}
}
function syncPlayer(p){
  if(!G||p.bot)return;
  const state=G.state.map(m=>({...m,...((m.k==='q'||m.k==='pick')?{rem:Math.max(0,G.tEnd-Date.now())}:{})}));
  sendToPlayer(p.pid,{k:'sync',qk:G.qk,score:p.score,name:p.name,used:[...p.used],answer:G.ans.get(p.pid)||null,
    question:G.q&&['ask','reveal'].includes(G.phase)?questionMsg():null,state});
}
function acceptAnswer(p,a,tk,qk=G&&G.qk){
  if(!G||!p||G.players.get(p.pid)!==p)return false;
  const reply=(ok,reason,answer)=>{sendToPlayer(p.pid,{k:'ack',qk,ok,reason,answer:answer||null,used:[...p.used],score:p.score});return ok;};
  if(qk!==G.qk)return reply(false,'stale');
  // Une retransmission reçoit la même confirmation sans deuxième mise ni deuxième point.
  if(G.ans.has(p.pid))return reply(true,'duplicate',G.ans.get(p.pid));
  const receivedAt=Date.now();
  if(G.phase!=='ask'||receivedAt>=G.tEnd||!p.online)return reply(false,'late');
  const q=G.q;
  if(isPerfT(q.type))return reply(false,'invalid');
  if(typeof a!=='string'&&typeof a!=='number')return reply(false,'invalid');
  const raw=String(a);
  if(['qcm','melody','video'].includes(q.type)&&(!/^[0-3]$/.test(raw)||!q.opts||Number(raw)>=q.opts.length))return reply(false,'invalid');
  if(q.type==='mem'&&(!/^[0-3]+$/.test(raw)||raw.length!==q.seq.length))return reply(false,'invalid');
  if(q.type==='text'&&(!raw.trim()||raw.length>60))return reply(false,'invalid');
  if(!['qcm','melody','video','mem','text'].includes(q.type))return reply(false,'invalid');
  if(p.bot&&tk==null)tk=botTok(p);
  const tok=typeof tk==='number'?tk:(typeof tk==='string'&&/^(?:[1-9]|1[0-9]|20)$/.test(tk)?Number(tk):NaN);
  if(!Number.isInteger(tok)||tok<1||tok>SCORING.tokens||p.used.has(tok))return reply(false,'token');
  const answer={a:raw,t:receivedAt,tk:tok};
  p.used.add(tok);G.ans.set(p.pid,answer);saveGame();reply(true,null,answer);updateCounts();
  const need=expectedAnswerers();
  if(need.length&&need.every(x=>G.ans.has(x.pid))&&!G.finishing){
    G.finishing=true;const game=G,question=G.qk;
    setTimeout(()=>{if(G===game&&G.qk===question&&G.phase==='ask')finishStage();},700);
  }
  return true;
}
function ranking(){return [...G.players.values()].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));}

/* ---- déroulement ---- */
function startGame(){
  sfx.start();G.prevRank=new Map();goIntro();
}
function goIntro(){
  watchTimers.forEach(clearTimeout);watchTimers=[];stopMelody();
  G.qi++;
  if(G.qi>=G.total){endGame();return;}
  G.sub=0;G.perf=null;G.ans=new Map();G.res=new Map();G.finishing=false;
  startPick();
}
function startPick(){
  const avail=Object.keys(G.pools).filter(c=>G.pools[c].length&&!G.used.has(c));
  if(!avail.length){endGame();return;}
  if(avail.length===1){chooseCat(avail[0]);return;}
  const on=onlineList();
  const ch=on.length?on[G.qi%on.length]:null;
  G.chooser=ch?{pid:ch.pid,name:ch.name,color:ch.color,bot:ch.bot}:null;
  G.avail=avail;G.phase='pick';G.qk++;G.tStart=Date.now();G.tEnd=G.tStart+12000;G.lastSec=-1;
  setState([pickMsg()]);
  renderHost();
  if(!G.chooser||G.chooser.bot){
    const qi=G.qi;
    botTimers.push(setTimeout(()=>{if(G&&G.phase==='pick'&&G.qi===qi)chooseCat(avail[rnd(avail.length)]);},1500+rnd(2500)));
  }
}
function pickMsg(){
  return {k:'pick',qk:G.qk,i:G.qi,n:G.total,cats:G.avail,ch:G.chooser?{id:G.chooser.pid,n:G.chooser.name}:null,t:12,rem:Math.max(0,G.tEnd-Date.now())};
}
function chooseCat(c){
  if(!G||G.picked===G.qi||!G.pools[c]||!G.pools[c].length)return;
  G.picked=G.qi;G.used.add(c);
  G.q=G.pools[c].shift();applyTime(G.q,G.cfg);G.qs.push(G.q);
  G.phase='intro';
  setState([{k:'intro',i:G.qi,n:G.total,cat:G.q.cat}]);
  renderHost();
  const tok=++introTok;
  setTimeout(()=>{if(!G||tok!==introTok||G.phase!=='intro')return;
    if(needsWatch(G.q))goWatch();else beginAsk();},2300);
}
function goWatch(){
  const q=G.q;G.phase='watch';
  setState([{k:'watch',ty:q.type,i:G.qi,n:G.total,cat:q.cat,mediaKind:q.media?.kind||null,len:q.seq?q.seq.length:0}]);
  renderHost();
  if(q.type==='mem'){
    const pads=$$('.hostq .pad');const F=[262,330,392,523];
    q.seq.forEach((v,i)=>{
      watchTimers.push(setTimeout(()=>{const el=pads[v];if(el){el.classList.add('flash');tone(F[v],0,.4,'triangle',.2);}},1500+i*900));
      watchTimers.push(setTimeout(()=>{const el=pads[v];if(el)el.classList.remove('flash');},1500+i*900+550));
    });
    watchTimers.push(setTimeout(()=>{if(G&&G.phase==='watch')beginAsk();},1500+q.seq.length*900+900));
  }
}
function beginAsk(){
  watchTimers.forEach(clearTimeout);watchTimers=[];
  const q=G.q;G.phase='ask';G.sub=0;G.qk++;G.ans=new Map();G.finishing=false;G.lastSec=-1;
  let time=q.time||20;
  G.perf=null;
  if(isPerfT(q.type)){
    const on=onlineList();const fresh=on.filter(x=>!G.performed.has(x.pid));const pl=fresh.length?fresh:on;
    const pp=pl.length?pl[rnd(pl.length)]:null;
    G.perf=pp?{pid:pp.pid,name:pp.name,color:pp.color}:null;if(pp)G.performed.add(pp.pid);
  }
  if(performanceMedia(q))time=q.performanceTime;
  else if(q.type==='karaoke'){
    const tu=TUNES.find(x=>x.id===q.tune);
    const secs=tu.notes.trim().split(/\s+/).reduce((s,x)=>s+(parseFloat(x.split(':')[1])||1),0)*60/tu.bpm;
    time=Math.ceil(secs)+4;
  }
  G.tStart=Date.now();G.tEnd=G.tStart+time*1000;
  setState([questionMsg()]);
  renderHost();
  if(q.type==='melody')playRoundMelody();
  if(q.type==='karaoke')startKaraoke();
  scheduleBots();
}
function questionMsg(){
  const q=G.q;
  const m={k:'q',qk:G.qk,i:G.qi,n:G.total,cat:q.cat,ty:q.type,p:q.p,t:Math.round((G.tEnd-G.tStart)/1000),rem:G.tEnd-Date.now(),sub:G.sub};
  if(q.opts)m.o=q.opts;
  if(q.media&&!performanceMedia(q))m.hasMedia=true;
  if(q.custom)m.custom=true;
  if(q.type==='mem')m.len=q.seq.length;

function finishStage(){
  if(!G||G.phase!=='ask')return;
  const q=G.q;botTimers.forEach(clearTimeout);botTimers=[];stopMelody();
  if(isPerfT(q.type)){startJudge();return;}
  G.prevRank=new Map(ranking().map((p,i)=>[p.pid,i]));
  const total=G.tEnd-G.tStart;
  const res=new Map();const dist=q.opts?q.opts.map(()=>0):null;let okCount=0;const okList=[];
  G.players.forEach(p=>{p.delta=0;});
  if(q.type==='playback'){
    const votes=[];G.ans.forEach((v,pid)=>{const n=Math.max(1,Math.min(5,parseInt(v.a,10)||0));if(pid!==(G.perf&&G.perf.pid))votes.push(n);});
    G.avg=votes.length?votes.reduce((a,b)=>a+b,0)/votes.length:0;
    G.ans.forEach((v,pid)=>res.set(pid,{pts:SCORING.voter,ok:true}));
    if(G.perf){const pp=Math.round(G.avg*SCORING.star);res.set(G.perf.pid,{pts:pp,ok:pp>0});}
  }else{
    G.ans.forEach((v,pid)=>{
      let ok=false;
      if(q.type==='qcm'||q.type==='melody'||q.type==='video'){const i=parseInt(v.a,10);ok=i===q.ok;if(dist&&i>=0&&i<dist.length)dist[i]++;}
      else if(q.type==='text')ok=matches(q,v.a);
      else if(q.type==='mem')ok=v.a===q.seq.join('');
      else if(q.type==='karaoke'){res.set(pid,{pts:v.tk,ok:true});okCount++;return;}
      if(ok){
        const rem=Math.max(0,Math.min(1,(G.tEnd-v.t)/total));
        res.set(pid,{pts:v.tk,ok:true});okCount++;okList.push([pid,v.t]);
      }else res.set(pid,{pts:0,ok:false});
    });
  }
  res.forEach((r,pid)=>{const p=G.players.get(pid);if(p){p.delta=r.pts;p.score+=r.pts;}});
  G.res=res;G.dist=dist;G.okCount=okCount;
  G.fast=okList.sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>G.players.get(x[0]).name);
  G.phase='reveal';
  const m={k:'rev',qk:G.qk,ty:q.type,res:[...res.entries()].map(([pid,r])=>[pid,r.pts])};
  if(q.type==='qcm'||q.type==='melody'||q.type==='video')m.ok=q.ok;
  if(q.type==='text')m.show=q.show;
  if(q.type==='mem')m.seqs=q.seq.join('');
  if(q.type==='playback')m.avg=Math.round(G.avg*10)/10;
  setState([m]);
  sfx.reveal();
  renderHost();
  if(okCount>0&&q.type!=='karaoke')confetti(40,.5,.55);
}

function advance(){
  if(!G)return;
  switch(G.phase){
    case 'lobby':if(onlineList().length>=2||(G.mode==='demo'&&onlineList().length>=2))startGame();break;
    case 'watch':if(G.q.type==='video'||G.q.media)beginAsk();break;
    case 'ask':finishStage();break;
    case 'judge':confirmJudge();break;
    case 'verdict':showEnd();break;
    case 'reveal':toBoard();break;
    case 'board':goIntro();break;
    case 'pick':chooseCat(G.avail[rnd(G.avail.length)]);break;

function hostTick(){
  if(G&&G.phase==='pick'){
    const rem=Math.max(0,G.tEnd-Date.now()),f=$('#tfill'),n=$('#tnum');
    if(f)f.style.width=(rem/(G.tEnd-G.tStart)*100)+'%';
    if(n)n.textContent=Math.ceil(rem/1000);
    if(rem<=0)chooseCat(G.avail[rnd(G.avail.length)]);
    return;
  }
  if(!G||G.phase!=='ask')return;
  const now=Date.now(),rem=Math.max(0,G.tEnd-now),secs=Math.ceil(rem/1000);
  const f=$('#tfill'),n=$('#tnum');
  if(f)f.style.width=(rem/(G.tEnd-G.tStart)*100)+'%';
  if(n)n.textContent=secs;
  if(secs!==G.lastSec){G.lastSec=secs;if(secs<=5&&secs>0&&G.q.type!=='melody'&&G.q.type!=='karaoke')sfx.tick();}
  if(rem<=0)finishStage();

function scheduleBots(){
  if(G.mode!=='demo')return;
  botTimers.forEach(clearTimeout);botTimers=[];
  const q=G.q,time=(G.tEnd-G.tStart);
  G.players.forEach(p=>{
    if(!p.bot)return;
    if(isPerfT(q.type))return;
    const d=1400+rnd(Math.max(1500,time*.62));
    botTimers.push(setTimeout(()=>{
      if(!G||G.phase!=='ask')return;
      let a;const good=Math.random()<p.skill;
      if(q.type==='qcm'||q.type==='melody'||q.type==='video')a=good?q.ok:(q.ok+1+rnd(3))%4;
      else if(q.type==='text')a=good&&Math.random()<.9?q.accept[0]:'zzz';
      else if(q.type==='mem')a=good?q.seq.join(''):q.seq.map(()=>rnd(4)).join('');
      else if(q.type==='karaoke')a='1';
      else a=3+rnd(3);
      acceptAnswer(p,a);
    },d));
  });
}

function countUp(el,a,b,ms){

  const t0=performance.now();
  (function f(n){const k=Math.min(1,(n-t0)/ms);el.textContent=fmt(Math.round(a+(b-a)*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f);})(t0);
}

function sendP(patch){

  if(S.mode==='demo'&&G){playerInput(PV.pid,PV.name,Object.assign(base,patch));return;}

function pvReceive(m){
  if(!m||m.c&&m.c!==PV.code||m.to&&m.to!==PV.pid)return;
  if(PV.sid&&m.sid&&m.sid!==PV.sid)return;
  if(m.sid)PV.sid=m.sid;
  receiveCatalogue(m.catalog);
  PV.lastMsg=Date.now();
  if(m.k==='denied'){PV.v='err';PV.notice=t('roomFull');pvRender();return;}
  if(m.k==='ack'){
    if(!PV.q||m.qk!==PV.q.qk||!['ask','sent'].includes(PV.v))return;
    PV.used=new Set(m.used||[]);store.set(usedKey(),[...PV.used].join(','));
    PV.score=m.score;
    if(m.ok&&m.answer){confirmPlayerAnswer(m.answer);return;}
    if(!PV.pending)return;
    PV.pending=null;PV.sent=false;PV.myA=null;PV.myTk=0;PV.tk=0;PV.seq=[];
    PV.notice=t(m.reason==='token'?'tokenBad':m.reason==='invalid'?'answerBad':'pLate');
    if(m.reason==='late'||m.reason==='stale'){PV.expired=true;}
    PV.v='ask';pvRender();return;
  }
  if(m.k==='sync'){
    const oldKey=PV.lastKey;
    if(m.question&&(!PV.q||PV.q.qk!==m.question.qk))PV.q=m.question;
    (m.state||[]).forEach(d=>pvReceive({...d,c:m.c,sid:m.sid}));
    const changed=PV.score!==m.score||[...PV.used].join(',')!==(m.used||[]).join(',');
    PV.score=m.score;PV.name=m.name||PV.name;PV.used=new Set(m.used||[]);store.set(usedKey(),[...PV.used].join(','));
    if(m.answer&&PV.q&&PV.q.qk===m.qk&&['ask','sent'].includes(PV.v)){
      if(!PV.sent||PV.pending||PV.myA!==m.answer.a)confirmPlayerAnswer(m.answer);
      else if(changed)pvRender();
    }else if(changed||oldKey!==PV.lastKey)pvRender();
    return;
  }
  const key=m.k+':'+(m.qk!=null?m.qk:(m.i!=null?m.i:''));
  if((m.k==='q'&&PV.q&&PV.q.qk===m.qk)||(m.k==='pick'&&PV.m&&PV.m.k==='pick'&&PV.m.qk===m.qk)){PV.tEnd=Date.now()+m.rem;}
  if(key===PV.lastKey)return;
  PV.lastKey=key;
  if(m.k!=='q')PV.pending=null;
  switch(m.k){
    case 'paused':PV.v='paused';PV.m=m;PV.pending=null;break;
    case 'lobby':PV.v='wait';PV.q=null;PV.cats=Array.isArray(m.cats)?m.cats.filter(c=>CATS[c]):[];break;
    case 'judge':PV.v='judge';PV.m=m;break;
    case 'verdict':{PV.v='verdict';PV.m=m;const pts=(m.list||[]).filter(x=>x[0]===PV.pid).reduce((sum,x)=>sum+x[1],0);PV.score+=pts;break;}
    case 'pick':PV.v='pick';PV.m=m;PV.q=null;PV.sent=false;PV.tEnd=Date.now()+m.rem;break;
    case 'intro':PV.v='intro';PV.m=m;PV.q=null;PV.sent=false;PV.res=null;break;
    case 'watch':PV.v='watch';PV.m=m;PV.sent=false;PV.seq=[];break;
    case 'q':
      PV.q=m;PV.tStart=Date.now()-(m.t*1000-m.rem);PV.tEnd=Date.now()+m.rem;
      PV.sent=false;PV.pending=null;PV.notice='';PV.expired=false;PV.myA=null;PV.seq=[];PV.tk=0;PV.myTk=0;PV.v='ask';
      break;
    case 'rev':{
      PV.m=m;PV.res=m;PV.v='rev';PV.pending=null;
      const r=(m.res||[]).find(x=>x[0]===PV.pid);PV.pts=r?r[1]:0;PV.got=!!r;
      PV.score+=PV.pts;if(PV.pts>0)try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
      break;}
    case 'lb':case 'end':{
      const idx=(m.all||[]).findIndex(x=>x[0]===PV.pid);
      PV.rank=idx>=0?idx+1:0;PV.total=m.tot;if(idx>=0)PV.score=m.all[idx][1];
      PV.v=m.k==='end'?'end':'lb';PV.pending=null;
      if(m.k==='end')setTimeout(()=>confetti(120,.5,.3),300);
      break;}
    default:return;
  }
  pvRender();
}

  if(PV.sent||PV.pending||!PV.q||isPerfT(PV.q.ty))return false;
  if(Date.now()>=PV.tEnd||PV.expired){PV.expired=true;PV.notice=t('pLate');pvRender();return false;}
  if(!PV.tk||PV.used.has(PV.tk)){toast(t('pTokFirst'));return false;}
  const raw=String(a);
  if(['qcm','melody','video'].includes(PV.q.ty)&&(!/^[0-3]$/.test(raw)||!PV.q.o||Number(raw)>=PV.q.o.length))return false;
  PV.pending={q:PV.q.qk,a:raw,tk:PV.tk};PV.lastSend=Date.now();PV.myA=raw;PV.myTk=PV.tk;PV.v='sent';
  pvRender();sendP(PV.pending);return true;
}

/* ========================= Connexion directe entre appareils (hors Claude) =========================
   Utilisée seulement quand le jeu n'est pas ouvert dans Claude. L'écran principal ouvre une « salle »
   dont l'identifiant est le code à 4 lettres ; chaque téléphone s'y connecte directement (WebRTC, via PeerJS). */
const PEER_PREFIX='yallaquiz-';
const PEER_LIBS=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
const getPeerClass=()=>window.Peer||(window.peerjs&&window.peerjs.Peer)||null;
function loadPeerJS(){
  return new Promise(res=>{
    if(getPeerClass())return res(true);
    let i=0;
    const next=()=>{
      if(i>=PEER_LIBS.length)return res(false);
      const s=document.createElement('script');s.src=PEER_LIBS[i++];s.async=true;
      s.onload=()=>getPeerClass()?res(true):next();
      s.onerror=()=>{s.remove();next();};
      document.head.appendChild(s);
    };
    next();
  });
}
function makeP2P(){
  const Peer=getPeerClass();
  const opts=()=>Object.assign({debug:0},window.__PEER_CFG||{});
  let peer=null,open=false,hostConn=null,myPres={},joined=false,retryT=0,wantCode='',failCb=null,hostFail=null,hasConnected=false;
  const conns=new Map();            // animateur : id de connexion -> {conn,pres}
  const evH={},peerCbs=[],connCbs=[];
  const clean=o=>{const r={};for(const k in o){if(o[k]!==null&&o[k]!==undefined)r[k]=o[k];}return r;};
  const fireConn=()=>connCbs.forEach(f=>{try{f(open);}catch(e){}});
  const snapshot=()=>[...conns.values()].map(c=>({kind:'viewer',peer:c.conn.peer,by:null,isMe:false,guest:false,presence:c.pres,updatedAt:Date.now()}));
  const firePeers=()=>{const l=snapshot();peerCbs.forEach(f=>{try{f({peers:l,joined:[],left:[],updated:[]});}catch(e){}});};
  function destroyPeer(){try{if(peer)peer.destroy();}catch(e){}peer=null;open=false;}
  const room={
    emit(topic,data){
      const msg={t:'e',topic,d:data};
      conns.forEach(c=>{try{if(c.conn.open)c.conn.send(msg);}catch(e){}});
      return Promise.resolve();
    },
    on(topic,f){(evH[topic]=evH[topic]||[]).push(f);return()=>{evH[topic]=(evH[topic]||[]).filter(x=>x!==f);};},
    emitTo(pid,topic,data){
      const msg={t:'e',topic,d:data};
      conns.forEach(c=>{if(c.pres.id===pid&&c.conn.open){try{c.conn.send(msg);}catch(e){}}});
      return Promise.resolve();
    },
    presence(patch){
      myPres=clean(Object.assign({},myPres,patch));
      if(hostConn&&hostConn.open){try{hostConn.send({t:'p',p:myPres});}catch(e){}}
      return Promise.resolve();
    },
    onPeers(f){peerCbs.push(f);try{f({peers:snapshot(),joined:[],left:[],updated:[]});}catch(e){}return()=>{const i=peerCbs.indexOf(f);if(i>=0)peerCbs.splice(i,1);};},
    peers:snapshot,
    connected:()=>open,
    onConnection(f){connCbs.push(f);try{f(open);}catch(e){}return()=>{const i=connCbs.indexOf(f);if(i>=0)connCbs.splice(i,1);};},
    helloCb:null,
    /* ---- animateur ---- */
    hostGame(code,onFail){
      teardown();hostFail=onFail||null;
      peer=new Peer(PEER_PREFIX+code,opts());
      peer.on('open',()=>{open=true;fireConn();});
      peer.on('disconnected',()=>{open=false;fireConn();try{if(peer&&!peer.destroyed)peer.reconnect();}catch(e){}});
      peer.on('error',e=>{const ty=e&&e.type;if(ty==='unavailable-id'){destroyPeer();if(hostFail)hostFail('taken');}else if(ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='socket-closed'){open=false;fireConn();}});
      peer.on('connection',conn=>{
        const key=conn.peer;
        const adopt=()=>{
          let rec=conns.get(key);
          if(rec&&rec.conn===conn)return rec;
          if(rec){try{rec.conn.close();}catch(e){}}
          rec={conn,pres:{}};conns.set(key,rec);return rec;
        };
        conn.on('open',()=>{adopt();setTimeout(()=>{try{if(room.helloCb)room.helloCb();}catch(e){}},250);});
        conn.on('data',d=>{
          if(!d||d.t!=='p'||typeof d.p!=='object')return;
          const rec=adopt();rec.pres=clean(d.p);firePeers();
        });
        conn.on('close',()=>{const rec=conns.get(key);if(rec&&rec.conn===conn){conns.delete(key);firePeers();}});
        conn.on('error',()=>{});
      });
    },
    /* ---- joueur ---- */
    joinGame(code,onFail){
      teardown();joined=true;wantCode=code;failCb=onFail||null;hasConnected=false;
      peer=new Peer(undefined,opts());
      peer.on('open',()=>connect());
      peer.on('disconnected',()=>{try{if(peer&&!peer.destroyed)peer.reconnect();}catch(e){}});
      peer.on('error',e=>{
        const ty=e&&e.type;
        if(ty==='peer-unavailable'){if(!hasConnected&&failCb)failCb('notfound');retry();}
        else if(ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='socket-closed'||ty==='webrtc'){retry();}
      });
    },
    leaveGame(){teardown();myPres={};fireConn();}
  };
  function teardown(){
    joined=false;clearTimeout(retryT);hostFail=null;failCb=null;
    try{if(hostConn)hostConn.close();}catch(e){}hostConn=null;
    conns.forEach(c=>{try{c.conn.close();}catch(e){}});conns.clear();
    destroyPeer();
  }
  function connect(){
    if(!joined||!peer)return;
    try{hostConn&&hostConn.close();}catch(e){}
    const cn=peer.connect(PEER_PREFIX+wantCode,{reliable:true,serialization:'json'});
    hostConn=cn;
    cn.on('open',()=>{open=true;hasConnected=true;fireConn();try{cn.send({t:'p',p:myPres});}catch(e){}});
    cn.on('data',d=>{if(d&&d.t==='e'&&typeof d.topic==='string')(evH[d.topic]||[]).slice().forEach(f=>{try{f({topic:d.topic,data:d.d,kind:'viewer',isMe:false});}catch(e){}});});
    cn.on('close',()=>{if(hostConn===cn){open=false;hostConn=null;fireConn();if(joined)retry();}});
    cn.on('error',()=>{});
  }
  function retry(){
    if(!joined)return;clearTimeout(retryT);
    retryT=setTimeout(()=>{if(!joined)return;if(peer&&!peer.destroyed&&!peer.disconnected)connect();else{try{if(peer)peer.reconnect();}catch(e){}retry();}},2500);
  }
  return room;
}
function hostP2P(){
  NET.room.helloCb=()=>{if(G)heartbeat();};
  NET.room.hostGame(G.code,why=>{
    if(!G)return;
    if(why==='taken'){
      // Après un rechargement, laisser au service le temps de libérer l'ancien code.
      if(G.phase==='paused'&&(NET.codeRetries=(NET.codeRetries||0)+1)<=4){
        const game=G;setTimeout(()=>{if(G===game)hostP2P();},750);return;
      }
      G.code=genCode();hostP2P();
      if(G.phase==='lobby')setState([{k:'lobby',cats:G.cfg.cats}]);else saveGame();
      renderHost();
    }
  });
}
function joinFail(){if(S.screen==='player'&&!PV.lastMsg){PV.v='err';pvRender();}}
function joinInviteHTML(){
  if(G.mode!=='live'||!NET.p2p)return '';
  const host=location.hostname.toLowerCase().replace(/\.$/,'');
  if(!/^https?:$/.test(location.protocol)||host==='localhost'||host.endsWith('.localhost')||/^127(?:\.\d{1,3}){3}$/.test(host)||host==='[::1]'||host==='0.0.0.0'){
    return `<p class="note">${t('joinFile')}</p>`;
  }
  const url=new URL(location.href);
  url.search='';
  url.hash='';
  url.searchParams.set('c',G.code);
  const qr=qrcode(0,'M');
  qr.addData(url.href);
  qr.make();
  return `<p class="note">${t('joinQr')}</p><a class="join-qr" href="${esc(url.href)}" target="_blank" rel="noopener" aria-label="${esc(t('joinLink'))}">${qr.createSvgTag(6,24)}</a><a class="note join-link" href="${esc(url.href)}" target="_blank" rel="noopener">${t('joinLink')}</a>`;
}

/* ========================= Démarrage ========================= */
const inviteCode=(new URLSearchParams(location.search).get('c')||'').toUpperCase();
if(/^[A-Z]{4}$/.test(inviteCode)){
  S.mode='live';
  PV.prefill=inviteCode;
  renderJoin();
}else renderHome();
(async()=>{
  try{
    const c=window.claude;
    if(c&&c.use){
      const [room,user]=await Promise.all([c.use('room').catch(()=>null),c.use('user').catch(()=>null)]);
      NET.room=room||null;
      if(user){try{NET.canHost=!!user.canEdit();}catch(e){}}
      if(S.screen==='home')renderHome();
    }
  }catch(e){}
  /* Hors Claude : connexion directe entre appareils */
  if(!NET.room){
    try{
      if(await loadPeerJS()){
        NET.room=makeP2P();NET.p2p=true;NET.canHost=true;
      }
    }catch(e){}
  }
  NET.loading=false;
  if(S.screen==='home')renderHome();
})();
/* Pour les tests */
window.__yq={get G(){return G;},get PV(){return PV;},advance,openGame,CFG,S};
})();
